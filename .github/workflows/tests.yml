name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-linux:
    name: App (Ubuntu, ohne Reachy-SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Das Reachy-SDK braucht unter Linux System-GStreamer; die Tests kommen ohne aus.
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install "numpy>=2.2" pytest ruff mypy
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q

  app-windows:
    name: App (Windows, komplette Installation)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: powershell  # Windows PowerShell 5.1 wie beim Nutzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Startskript-Logik (Python finden, .venv anlegen, App + Reachy-SDK installieren)
        run: |
          . .\python-env.ps1
          $py = Initialize-AppEnvironment
          & $py -m pip install -q -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Tests
        run: |
          .\.venv\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: GStreamer/WebRTC aus dem Reachy-SDK vorhanden
        run: |
          .\.venv\Scripts\python.exe -c "import reachy_mini, gi; gi.require_version('Gst', '1.0'); from gi.repository import Gst; Gst.init(None); missing = [e for e in ('webrtcsrc', 'webrtcbin', 'appsink', 'appsrc', 'audioconvert', 'audioresample', 'opusdec', 'opusenc') if Gst.ElementFactory.find(e) is None]; print('fehlt:', missing) if missing else print('GStreamer/WebRTC OK'); raise SystemExit(1 if missing else 0)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: CLI startet und erklaert fehlenden Roboter
        run: |
          .\.venv\Scripts\python.exe -m reachy_claude --robot 127.0.0.1 check-audio --seconds 1
          if ($LASTEXITCODE -ne 1) { Write-Host "Erwartet: Exit-Code 1 (kein Roboter)"; exit 1 }
          exit 0
      - name: Spracherkennung (Whisper small auf CPU) mit echter Testaufnahme
        run: |
          .\.venv\Scripts\python.exe -c "from pathlib import Path; from reachy_claude.audio import load_wav; from reachy_claude.segmenter import SpeechSegmenter; from reachy_claude.stt import SttConfig, WhisperTranscriber; from reachy_claude.wakeword import parse_wake; audio, _ = load_wav(Path('tests/data/vier_saetze_raumrauschen.wav')); seg = SpeechSegmenter(); utts = [u for i in range(0, audio.size, 320) for u in seg.feed(audio[i:i+320])]; stt = WhisperTranscriber(SttConfig(device='cpu')); texts = [stt.transcribe(u) for u in utts]; [print(repr(t), parse_wake(t).kind.name) for t in texts]; kinds = [parse_wake(t).kind.name for t in texts]; raise SystemExit(0 if kinds[1] == 'COMMAND' and kinds[0] == 'NONE' else 1)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Sprachausgabe (Piper thorsten-medium von Hugging Face) erzeugt 16-kHz-Audio
        run: |
          .\.venv\Scripts\python.exe -c "from reachy_claude.tts import PiperSpeaker; from reachy_claude.audio import SAMPLE_RATE; sp = PiperSpeaker(); a = sp.synthesize('Ich habe die Funktion ergänzt. Sie gibt a minus b zurück.'); d = a.size / SAMPLE_RATE; print(sp.description, round(d, 2), 's', round(float(abs(a).max()), 2)); raise SystemExit(0 if 2.0 < d < 8.0 else 1)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Rundweg Sprachausgabe -> Spracherkennung (Piper spricht, Whisper erkennt)
        run: |
          .\.venv\Scripts\python.exe -c "from reachy_claude.tts import PiperSpeaker; from reachy_claude.stt import SttConfig, WhisperTranscriber; from reachy_claude.wakeword import parse_wake; text = WhisperTranscriber(SttConfig(device='cpu')).transcribe(PiperSpeaker().synthesize('Claude, schreib bitte einen Test.')); r = parse_wake(text); print(repr(text), r.kind.name, repr(r.command)); raise SystemExit(0 if r.kind.name == 'COMMAND' else 1)"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  legacy:
    name: Legacy v1 (Bridge + Roboter-Tool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "legacy/bridge[dev]"
      - run: python -m pytest -q
        working-directory: legacy/bridge
      - run: python -m pytest -q
        working-directory: legacy/robot
