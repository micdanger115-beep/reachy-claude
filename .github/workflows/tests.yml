name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: Bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows ist Pflicht: die Bridge laeuft auf dem Windows-PC des Nutzers.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q
      # Startskripte unter dem echten Windows PowerShell 5.1 pruefen (Python suchen, .venv anlegen).
      - name: PowerShell-Startskripte (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          . .\python-env.ps1
          $py = Initialize-BridgeEnvironment
          & $py -c "import claude_bridge, websockets; print('Startskript OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  robot-tool:
    name: Roboter-Tool
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff
      # Der Integrationstest mit der echten Conversation-App wird hier uebersprungen
      # (braucht GStreamer & Co.); lokal ausfuehren, siehe README.md.
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check external_tools
